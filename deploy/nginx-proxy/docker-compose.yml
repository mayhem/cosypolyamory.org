# Reverse proxy that terminates TLS and routes by Host header.
# Certificates are read from ./certs, named <hostname>.crt / <hostname>.key.
# Add the acme-companion service below once the hostname resolves publicly
# and inbound port 80 is open, to get certificates from Let's Encrypt.

services:
  nginx-proxy:
    image: nginxproxy/nginx-proxy:latest
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - ./certs:/etc/nginx/certs:ro
      - conf:/etc/nginx/conf.d
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html

volumes:
  conf:
  vhost:
  html:

networks:
  default:
    name: nginx-proxy
    external: true
